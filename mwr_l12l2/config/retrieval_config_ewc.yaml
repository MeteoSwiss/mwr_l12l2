# config file for general retrieval settings #
##############################################
# 
# the general section contains general settings for the retrieval
# the data section contains paths of data files and age of data to consider
# the vip section contains configurations for the TROPoe retrieval
# this file defines the settings common to all stations.

general: 
  # general settings for the retrieval
  operational: True
  retrieval_time: 15
  L2_format_config_file: 'L2_format.yaml'
  TROPoe_output_config_file: 'tropoe_output_config.yaml'

# definitions of which data to use for retrieval. Paths are absolute or relative to mwr_l12l2 project dir
data:

  # maximum age of MWR data to be considered for retrieval in minutes. Set to null for unlimited
  max_age: 90

  # real-time mode: delay in minutes after the retrieval window end before triggering the retrieval
  # (gives time for the last files of the window to arrive in the bucket)
  nrt_delay_minutes: 1

  # check MWR quality flags and filter out bad data (at the moment, can't be applied to past data as quality flags were not yet properly set, but should be applied to future data)
  # BEWARE: setting this to False will ignore the filtering of bad quality L1 data and will accordingly flag badly the L2 data !
  check_mwr_quality: True

  # minimum fraction of retrieval time that must be covered by MWR observations to run the retrieval (between 0 and 1)
  mwr_obs_duration_threshold: 0.6

  # maximum difference between the lat, lon and alt variables defined in the MWR L1 and the config file
  tolerance_lat_lon: 0.2
  tolerance_alt: 50

  # maximum altitude range to keep in the MWR L2 retrieval output (in m.a.g.l)
  max_altitude_magl: 10000

  # Threshold for cumulated degree of freedom of the signal (DFS) above which the retrieval should be disregarded. Set to null for unlimited.
  # This is a quality control threshold that can be applied to the retrieval results.
  temperature_cdf_threshold: 0.95
  waterVapor_cdf_threshold: 0.8

  # info on instrument configuration files
  inst_config_dir: /home/eric/eprofile_config/mwr/l12l2/
  inst_config_file_prefix: config_

  # location and filenames of output data
  output_dir: /home/eric/level2/  # directory for microwave radiometer input data
  #output_dir_copy: /home/eric/level2/
  output_bucket_copy: eprofile-mwr-dev-l2 # S3 bucket for copying level 2 data
  bucket_credentials: /home/eric/.s3cfg # path to S3 credentials file
  output_file_prefix: MWR_2C01_
  
  # location and filenames of input E-PROFILE data
  mwr_dir: /home/eric/level1/ # /data/eprofile-mwr-dev-l1/  # directory for microwave radiometer input data
  mwr_bucket: eprofile-mwr-l1 # S3 bucket for microwave radiometer input data
  mwr_file_prefix: MWR_1C01_
  alc_dir: /data/eprofile-alc-l2/  # directory for automatic lidar's or ceilometer's cloud base input data
  alc_file_prefix: L2_

  # location and filename of model data (does not have to match outfile of mars config, will be put here by sort_model)
  # TODO: write sort_model (put mars output to right location and run grb_to_nc) and sort_eprofile (get from FTP)
  model_dir: /data/eprofile-ecmwf-data/  # directory for NWP model input data
  model_fc_file_prefix: ecmwf_fc_
  model_fc_file_suffix: _converted_to  # for file converted from grib to NetCDF
  model_fc_file_ext: .nc
  model_z_file_prefix: ecmwf_z_
  model_z_file_ext: .grb

  # location and filenames of temporary TROPoe files
  tropoe_img: 'davidturner53/tropoe:v1.0'
  tropoe_basedir: mwr_l12l2/data/tropoe/  # base directory where folder with tmp files for tropoe runs is saved
  tropoe_subfolder_basename: node_  # basename of subfolders for different (parallel) TROPoe runs
  tropoe_dir_mountpoint: /data  # where the tropoe subfolder shall be mounted inside the TROPoe container
  vip_filename_tropoe: vip.txt
  result_basefilename_tropoe: tropoe_out
  mwr_basefilename_tropoe: mwr.
  alc_basefilename_tropoe: alc.
  model_prof_basefilename_tropoe: model_prof.
  model_sfc_basefilename_tropoe: met.

  # Time tolerances
  alc_time_tolerance_minutes: 5  # minutes - tolerance for matching ALC data with MWR data
  file_time_threshold_hours: 12  # hours - threshold for including files outside time range

  # Apriori file
  default_apriori_file: 'prior.MIDLAT.nc'  

  default_cbh_km: 2.0  # km - default cloud base height when no ALC available
  tropoe_verbosity: 2  # verbosity level for TROPoe output

  # List of derived products to be included in the output file and have the retrieval_type attribute set to "derived product"
  derived_product_list: ['rh', 'pwv', 'theta', 'thetae', 'dewpt', 'pblh', 'mlCAPE', 'mlCIN','mlLCL', 'ko_index', 'total_totals', 'k_index', 'showalter_index', 's_index', 'thompson_index', 'jefferson_index', 'fog_threat', 'mdpi', 'tq_index', lifted_index]

# general settings for TROPoe's vip files (must match vip keywords; do not set paths, taken from data.*tropoe* above)
vip:
  # Set the temporal resolution and vertical grid of the retrieval
  avg_instant: 0
  #tres: 15
  zgrid: [0, 0.060, 0.120, 0.240, 0.480, 0.720, 0.960, 1.2, 1.44, 1.68, 1.98, 2.28, 2.58, 2.88, 3.25, 3.6, 4.014, 4.426, 4.879, 5.376, 5.924, 6.526, 7.189, 7.918, 8.72, 9.602, 10.572, 11.639, 12.813, 14.104, 15.525, 17.087]

  # Indicate that this is a MWR-based retrieval
  irs_type: -1

  # The parameters for a zenith-pointing radiometer
  mwr_type: 4
  mwr_elev_field: ele
  mwr_freq_field: frequency
  mwr_tb_field_names: tb
  mwr_tb_field1_tbmax: 100.

  # The parameters for an elevation scanning radiometer are now defined in the code

  # Surface met parameters: default to meteorological station installed on the MWR
  # Will be overridden if no measurements are available and model data is used instead
  ext_sfc_relative_height: 0
  ext_sfc_rootname: 'mwr'
  ext_sfc_pres_type: 1 # indicates that ext sfc pres data exists (could be either MWR or model)
  ext_sfc_time_format: -1
  ext_sfc_pres_fieldname: 'air_pressure'
  ext_sfc_pres_units: 2 # indicates hPa
  ext_sfc_temp_type: 1 # indicates that ext sfc temp data exists (could be either MWR or model)
  ext_sfc_temp_fieldname: 'air_temperature'
  ext_sfc_temp_units: 2 # indicates Kelvin
  ext_sfc_temp_random_error: 0.5  # K - temperature error for surface measurements
  ext_sfc_wv_type: 1
  ext_sfc_wv_fieldname: 'relative_humidity'
  ext_sfc_wv_units: 1 # indicates %RH
  ext_sfc_rh_random_error: 3.0  # % - relative humidity error for surface measurements

  # The model input
  mod_temp_prof_type: 0
  mod_temp_noise_adder_val: [5, 2, 2]
  mod_temp_noise_adder_hts: [0,  5, 20]
  mod_temp_prof_maxht: 18.
  # mod_temp_time_delta: 4.
  mod_wv_prof_type: 0
  mod_wv_noise_mult_val: [16, 8, 8]
  mod_wv_noise_mult_hts: [0, 5, 20]
  mod_wv_prof_maxht: 18.
  # mod_wv_time_delta: 4.
  
  output_akernal: 2

  # The ceilometer input and cloudbase height
  # The ceilometer input
  cbh_type: 7
  cbh_default_ht: 2.
  # The output information
  output_clobber: 1

  # VIP quality checks:
  qc_gamma_value: 3
  qc_rms_value: 2