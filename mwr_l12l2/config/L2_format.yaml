# config file for defining the format of the output L2 NetCDF #
###############################################################

dimensions:
  unlimited:
    - time  # refers to variable name in data dictionary
  fixed:
    - altitude
    - avk_altitude
    - bnds

variables:
  time:  # variable name in Measurement.data Dataset
    name: time  # variable name in output NetCDF
    dim:
      - time
    type: i8
    _FillValue: null
    optional: False
    attributes:
      long_name: Time (UTC) of the measurement
      standard_name: time
      units: seconds since 1970-01-01 00:00:00
      calendar: standard
      bounds: time_bnds
      comment: Time indication of samples is at the end of integration time

  altitude:
    name: altitude
    dim:
      - altitude
    type: f4
    _FillValue: -999.
    optional: False
    attributes:
      long_name: Height above mean sea level
      standard_name: altitude
      units: m
      positive: up
      axis: Z

  avk_altitude:
    name: avk_altitude
    dim:
      - avk_altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Height above mean sea level
      standard_name: altitude
      units: m
      positive: up
      axis: Z
      comment: Used for the AVKs second dimension, same as altitude

  latitude:
    name: latitude
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: False
    attributes:
      long_name: Latitude of measurement station
      standard_name: latitude
      units: degree_north
    
  longitude:
    name: longitude
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: False
    attributes:
      long_name: Longitude of measurement station
      standard_name: longitude
      units: degree_east

  station_latitude:
    name: station_latitude
    dim:
      - time
    type: f4
    _FillValue: -999.
    optional: False
    attributes:
      long_name: Latitude of measurement station
      standard_name: deployment_latitude
      units: degree_north

  station_longitude:
    name: station_longitude
    dim:
      - time
    type: f4
    _FillValue: -999.
    optional: False
    attributes:
      long_name: Longitude of measurement station
      standard_name: deployment_latitude
      units: degree_east

  # in this case, the variable has already been created 
  station_altitude:
    name: station_altitude
    dim:
      - time
    type: f4
    _FillValue: -999.
    optional: False
    attributes:
      long_name: Height above mean sea level of measurement station
      standard_name: surface_altitude
      units: m

  time_bnds:
    name: time_bnds 
    dim:
      - time
      - bnds
    type: i8
    _FillValue: null #CF compliance checker says that time_bnds should not have a FillValue...
    optional: False
    attributes:
      long_name: Start and end time (UTC) of the measurements
      #standard_name: time_bnds
      units: seconds since 1970-01-01 00:00:00
      calendar: standard
      #comment: Variable not set at the moment, to be implemented in the future

####################################
# Propagated from L1
  azi: 
    name: azimuth_angle
    dim:
      - time
    type: f4
    _FillValue: -999.
    optional: False
    attributes:
      long_name: Sensor azimuth angle
      standard_name: sensor_azimuth_angle 
      units: degree
      comment: “0=North, 90=East, 180=South, 270=West”
  
  quality_flag_status:
    name: quality_flag_status
    dim:
      - time
    type: i2
    _FillValue: -999
    optional: False
    attributes:
      long_name: Checks not executed in determination of quality_flag
      flag_masks: [1, 2, 4, 8, 16, 32, 64, 128]
      flag_meanings: missing_tb_not_checked tb_lower_threshold_not_checked tb_upper_threshold_not_checked spectral_consistency_not_checked receiver_sanity_not_checked rain_not_checked sun_in_beam_not_checked tb_offset_not_checked

##########################################################################################################
# Measurement mode
##########################################################################################################
  
  observing_geometry_flag:
    name: observing_geometry_flag
    dim:
      - time
    type: i1
    _FillValue: -128
    optional: True
    attributes:
      long_name: 'Flag for the observing geometry'
      flag_values: [0, 1]
      flags_meaning: 'single_pointing multiple_pointing'
      units: "1"


# ##########################################################################################################
# # QC fields
# ##########################################################################################################

  # TODO: remove the TROPoe flag once we are confident that conversion to quality_flag is working
  qc_flag:
    name: qc_flag
    dim:
      - time
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: original TROPoe quality control flag

  quality_flag:
    name: quality_flag
    dim:
      - time
    type: i1
    _FillValue: -128
    optional: False
    attributes:
      long_name: Quality flag
      standard_name: quality_flag
      flag_masks: [1, 2, 4, 8]
      flag_meanings: 'no_L1_QC non_convergence high_rms high_gamma'
      comment: 0 indicates data with good quality.

##########################################################################################################
# Temperature fields 
##########################################################################################################

  temperature:
    name: temperature
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Temperature profile
      standard_name: air_temperature
      units: K
      ancillary_variables: temperature_apriori temperature_random_error temperature_systematic_error temperature_avk temperature_vertical_resolution temperature_quality_flag
      #units_metadata: "temperature: on_scale" -> for CF1.11

  temperature_prior:
    name: temperature_apriori
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: A priori temperature profile of retrieval
      units: K

  sigma_temperature:
    name: temperature_random_error
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True 
    attributes:
      long_name: Random uncertainty of temperature profile
      units: K

  temperature_systematic_error:
    name: temperature_systematic_error
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True  
    attributes:
      long_name: Systematic uncertainty of temperature profile
      units: K

  temperature_avk:
    name: temperature_avk
    dim:
      - time
      - altitude
      - avk_altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Averaging kernels for temperature profile
      units: "1"

  vres_temperature_no_model:
    name: temperature_vertical_resolution
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Vertical resolution of temperature profile     
      #comment: 'Corresponds to the full width at half maximum of the averaging kernel'
      units: m

  temperature_quality_flag:
    name: temperature_quality_flag
    dim:
      - time
      - altitude
    type: i1
    _FillValue: -128
    optional: True
    attributes:
      long_name: Quality flag for temperature profile
      flag_values: [0, 1]
      flag_meanings: good_quality bad_quality
      units: "1"

##########################################################################################################
# Water Vapor fields
##########################################################################################################

  waterVapor:
    name: water_vapor_vmr
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Water vapor profile
      standard_name: humidity_mixing_ratio
      units: ppm
      ancillary_variables: water_vapor_vmr_apriori water_vapor_vmr_random_error water_vapor_vmr_systematic_error water_vapor_vmr_avk water_vapor_vmr_vertical_resolution water_vapor_vmr_quality_flag
      # TODO should probably transform this to ppm to comply with the format definition doc. Synchronise with this document
      # TODO: check for standard name and adequate units: https://cfconventions.org/Data/cf-standard-names/current/build/cf-standard-name-table.html

  waterVapor_prior:
    name: water_vapor_vmr_apriori
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: A priori water vapour profile of retrieval
      units: ppm

  sigma_waterVapor:
    name: water_vapor_vmr_random_error
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Random uncertainty of water vapour profile
      units: ppm

  humidity_mixing_ratio_systematic_error:
    name: water_vapor_vmr_systematic_error
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True  
    attributes:
      long_name: Systematic uncertainty of water vapour profile
      units: ppm

  waterVapor_avk:
    name: water_vapor_vmr_avk
    dim:
      - time
      - altitude
      - avk_altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Averaging kernels for water vapour profile
      units: "1"

  vres_waterVapor_no_model:
    name: water_vapor_vmr_vertical_resolution
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Vertical resolution of water vapour profile
      #comment: 'Corresponds to the full width at half maximum of the averaging kernel'
      units: m

  waterVapor_quality_flag:
    name: water_vapor_vmr_quality_flag
    dim:
      - time
      - altitude
    type: i1
    _FillValue: -128
    optional: True
    attributes:
      long_name: Quality flag for water vapour profile
      flag_values: [0, 1]
      flag_meanings: good_quality bad_quality
      units: "1"

  rh:
    name: relative_humidity
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Relative Humidity
      standard_name: relative_humidity
      units: "1"
      comment: ''
      ancillary_variables: quality_flag

  theta:
    name: potential_temperature
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Potential Temperature
      standard_name: air_potential_temperature
      units: K
      comment: ''
      ancillary_variables: quality_flag

  thetae:
    name: equivalent_potential_temperature
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Equivalent potential temperature
      standard_name: air_equivalent_potential_temperature
      units: K
      comment: ''
      ancillary_variables: quality_flag

  dewpt:
    name: dew_point_temperature
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Dew point temperature
      standard_name: dew_point_temperature
      units: K
      comment: ''
      ancillary_variables: quality_flag

##########################################################################################################
# Measurement related fields
##########################################################################################################
  # rmsr:
