##########################################################################################################
# Derived fields
##########################################################################################################
# For the derived fiels, we keep on an "uncertainty" associated variables and describe how it is obtained

  rh:
    name: relative_humidity
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Relative Humidity
      standard_name: relative_humidity
      units: "%"
      #comment: ''
      ancillary_variables: relative_humidity_uncertainty relative_humidity_quality_flag
  
  sigma_rh:
    name: relative_humidity_uncertainty
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Uncertainty of relative humidity
      comment: 'Calculated from the uncertainties of temperature and water vapour profiles using error propagation'
      units: "%"

  rh_quality_flag:
    name: relative_humidity_quality_flag
    dim:
      - time
      - altitude
    type: i1
    _FillValue: -128
    optional: True
    attributes:
      long_name: Quality flag for relative humidity
      flag_masks: [1, 2, 4]
      flag_meanings: bad_temperature_profile bad_water_vapour_profile unknown_quality
      comment: 0 indicates data with good quality.
      units: "1"

  theta:
    name: potential_temperature
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Potential Temperature
      standard_name: air_potential_temperature
      units: K
      #comment: ''
      ancillary_variables: potential_temperature_uncertainty potential_temperature_quality_flag
  
  sigma_theta:
    name: potential_temperature_uncertainty
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Random uncertainty of potential temperature
      units: K

  theta_quality_flag:
    name: potential_temperature_quality_flag
    dim:
      - time
      - altitude
    type: i1
    _FillValue: -128
    optional: True
    attributes:
      long_name: Quality flag for potential temperature
      flag_masks: [1, 2, 4]
      flag_meanings: bad_temperature_profile bad_water_vapour_profile unknown_quality
      comment: 0 indicates data with good quality.
      units: "1"

  thetae:
    name: equivalent_potential_temperature
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Equivalent potential temperature
      standard_name: air_equivalent_potential_temperature
      units: K
      #comment: ''
      ancillary_variables: equivalent_potential_temperature_uncertainty equivalent_potential_temperature_quality_flag

  sigma_thetae:
    name: equivalent_potential_temperature_uncertainty
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Uncertainty of equivalent potential temperature
      units: K

  thetae_quality_flag:
    name: equivalent_potential_temperature_quality_flag
    dim:
      - time
      - altitude
    type: i1
    _FillValue: -128
    optional: True
    attributes:
      long_name: Quality flag for equivalent potential temperature
      flag_masks: [1, 2, 4]
      flag_meanings: bad_temperature_profile bad_water_vapour_profile unknown_quality
      comment: 0 indicates data with good quality.
      units: "1"

  dewpt:
    name: dew_point_temperature
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Dew point temperature
      standard_name: dew_point_temperature
      units: K
      #comment: ''
      ancillary_variables: dew_point_temperature_uncertainty dew_point_temperature_quality_flag

  sigma_dewpt:
    name: dew_point_temperature_uncertainty
