##########################################################################################################
# Temperature fields 
##########################################################################################################

  temperature:
    name: temperature
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Temperature profile
      standard_name: air_temperature
      units: K
      ancillary_variables: temperature_apriori temperature_random_uncertainty temperature_systematic_uncertainty temperature_avk temperature_vertical_resolution temperature_quality_flag
      #units_metadata: "temperature: on_scale" -> for CF1.11

  temperature_prior:
    name: temperature_apriori
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: A priori temperature profile of retrieval
      units: K

  sigma_temperature:
    name: temperature_random_uncertainty
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True 
    attributes:
      long_name: Random uncertainty of temperature profile
      units: K

  temperature_systematic_uncertainty:
    name: temperature_systematic_uncertainty
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True  
    attributes:
      long_name: Systematic uncertainty of temperature profile
      units: K

  temperature_avk:
    name: temperature_avk
    dim:
      - time
      - altitude
      - avk_altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Averaging kernels for temperature profile
      units: "1"

  vres_temperature_no_model:
    name: temperature_vertical_resolution
    dim:
      - time
      - altitude
    type: f4
    _FillValue: -999.
    optional: True
    attributes:
      long_name: Vertical resolution of temperature profile     
      #comment: 'Corresponds to the full width at half maximum of the averaging kernel'
      units: m

  temperature_quality_flag:
    name: temperature_quality_flag
    dim:
      - time
      - altitude
    type: i1
    _FillValue: -128
    optional: True
    attributes:
      long_name: Quality flag for temperature profile
      flag_masks: [1, 2, 4, 8]
      flag_meanings: 'non_convergence high_rms high_gamma outside_trusted_vertical_range'
      #comment: # set during the processing
      units: "1"

##########################################################################################################
# Water Vapor fields
##########################################################################################################

