[tool.poetry]
name = "mwr_l12l2"
version = "0.1.0"
description = "This sets up the retrieval of humidity and temperature from ground-based microwave radiometers and is used in E-PROFILE"
authors = ["Rolf Rüfenacht <rruefenacht@users.noreply.github.com>"]
license = "BSD-3-Clause"
readme = "README.md"
homepage = "https://github.com/MeteoSwiss/mwr_l12l2"
repository = "https://github.com/MeteoSwiss/mwr_l12l2"
documentation = "https://mwr-l12l2.readthedocs.io"
keywords = ["microwave", "radiometer", "retrieval", "e-profile","remote sensing"]
classifiers = [
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[tool.poetry.dependencies]
python = "^3.11"
PyYAML = "^6.0"
numpy = "^1.20"
cfgrib = "^0.9.10"
netCDF4 = "^1.6.3"
xarray = "^2023.1"
matplotlib = "^3.5"
boto3 = "^1.26"
dask = "^2023.1.0"
pandas = "^2.0"
colorlog = {version = "^6.0", optional = true}
Sphinx = {version = "^6", optional = true}
sphinx-rtd-theme = {version = "^1.2.2", optional = true}
sphinxcontrib-napoleon = {version = "^0.7", optional = true}

[tool.poetry.extras]
docs = ["Sphinx", "sphinx-rtd-theme", "sphinxcontrib-napoleon"]
color = ["colorlog"]

[tool.poetry.group.dev.dependencies]
flask = "*"
waitress = "*"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
